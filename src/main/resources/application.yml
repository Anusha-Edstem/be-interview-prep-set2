spring:
  application:
    name: be-interview-prep-set2
  datasource:
    url: jdbc:h2:mem:interviewprep;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

app:
  storage:
    location: ${FILE_STORAGE_LOCATION:${java.io.tmpdir}/be-interview-prep-set2/uploads}
    max-file-size: 5MB
  rate-limit:
    limit: ${RATE_LIMIT_REQUESTS:10}
    window: ${RATE_LIMIT_WINDOW:1m}
    header-name: ${RATE_LIMIT_HEADER:X-API-Key}
  booking:
    day-start: "09:00"
    day-end: "17:00"
    slot-length: ${BOOKING_SLOT_LENGTH:30m}
    hold-length: ${BOOKING_HOLD_LENGTH:5m}
