spring:
  application:
    name: be-interview-prep-set2
  datasource:
    url: jdbc:h2:mem:interviewprep;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

app:
  rate-limit:
    limit: ${RATE_LIMIT_REQUESTS:10}
    window: ${RATE_LIMIT_WINDOW:1m}
    header-name: ${RATE_LIMIT_HEADER:X-API-Key}
