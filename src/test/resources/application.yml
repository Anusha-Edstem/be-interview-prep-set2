spring:
  datasource:
    url: jdbc:h2:mem:interviewprep-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

app:
  storage:
    location: ${java.io.tmpdir}/be-interview-prep-set2-test/uploads
    max-file-size: 5MB
  rate-limit:
    limit: 10
    window: 1m
    header-name: X-API-Key
  booking:
    day-start: "09:00"
    day-end: "17:00"
    slot-length: 30m
    hold-length: 5m
